<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Form</title>
  </head>
  <body>
    <h1>Registration Form</h1>

    <form>
      <label for="email">Correo:</label>
      <input type="email" id="email" name="email" />
      <br /><br />

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" />
      <br /><br />

      <label for="name">Nombre:</label>
      <input type="text" id="name" name="name" />
      <br /><br />

      <label for="lastName">Apellidos:</label>
      <input type="text" id="lastName" name="lastName" />
      <br /><br />

      <p>¿Es empleado?</p>

      <label>
        <input type="radio" name="employee" value="yes" id="employeeYes" />
        Sí
      </label>

      <label>
        <input type="radio" name="employee" value="no" id="employeeNo" />
        No
      </label>

      <br /><br />

      <div id="employmentField" style="display: none">
        <label for="employment">Empleo:</label>
        <input type="text" id="employment" name="employment" />
      </div>

      <br />

      <button type="submit">Enviar</button>
    </form>

    <script>
      const employeeYes = document.getElementById("employeeYes");
      const employeeNo = document.getElementById("employeeNo");
      const employmentField = document.getElementById("employmentField");

      employeeYes.addEventListener("change", function () {
        employmentField.style.display = "block";
      });

      employeeNo.addEventListener("change", function () {
        employmentField.style.display = "none";
      });
    </script>
  </body>
</html>
