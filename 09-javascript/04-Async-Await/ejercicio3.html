<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search User</title>

    <style>
      .container {
        width: 300px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        text-align: center;
      }

      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        box-sizing: border-box;
      }

      button {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }

      #result {
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Search User</h2>

      <input type="number" id="userId" placeholder="Enter user ID" min="1" />

      <button id="searchButton">Search</button>

      <div id="result"></div>
    </div>

    <script src="ejercicio3.js"></script>
  </body>
</html>
