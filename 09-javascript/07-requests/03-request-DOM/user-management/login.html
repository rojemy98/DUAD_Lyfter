<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | User Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="eyebrow">USER MANAGEMENT</div>
      <h1>Iniciar sesión</h1>
      <p class="muted">Ingresa el ID que recibiste al registrarte y tu contraseña.</p>
      <form id="login-form">
        <label for="user-id">ID de usuario</label>
        <input id="user-id" name="userId" type="text" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="button">Iniciar sesión</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p class="footer-text">¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
      <p class="footer-text"><a href="cambio-password.html">¿Necesitas cambiar tu contraseña?</a></p>
    </section>
  </main>
</body>
</html>
