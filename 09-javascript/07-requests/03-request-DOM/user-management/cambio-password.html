<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña | User Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cambio-password.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="eyebrow">USER MANAGEMENT</div>
      <h1>Cambiar contraseña</h1>
      <p class="muted">Introduce tu ID y valida tu contraseña actual antes de cambiarla.</p>
      <form id="password-form">
        <label for="user-id">ID de usuario</label>
        <input id="user-id" name="userId" type="text" required>

        <label for="old-password">Contraseña anterior</label>
        <input id="old-password" name="oldPassword" type="password" autocomplete="current-password" required>

        <label for="new-password">Nueva contraseña</label>
        <input id="new-password" name="newPassword" type="password" autocomplete="new-password" required minlength="4">

        <label for="confirm-password">Confirmar nueva contraseña</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="4">

        <button type="submit" class="button">Actualizar contraseña</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p class="footer-text"><a href="perfil.html">Volver a mi perfil</a> · <a href="login.html">Login</a></p>
    </section>
  </main>
</body>
</html>
