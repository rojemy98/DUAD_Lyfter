<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | User Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/registro.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="eyebrow">USER MANAGEMENT</div>
      <h1>Crear cuenta</h1>
      <p class="muted">Completa tus datos para crear tu usuario.</p>
      <form id="register-form">
        <label for="name">Nombre completo</label>
        <input id="name" name="name" type="text" autocomplete="name" required maxlength="100">

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="150">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="4">

        <button type="submit" class="button">Crear cuenta</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p class="footer-text">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>
</body>
</html>
