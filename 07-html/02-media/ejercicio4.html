<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aprendiendo HTML</title>
  </head>
  <body>
    <h1>Aprendiendo HTML</h1>

    <p>
      HTML significa HyperText Markup Language y es el lenguaje de marcado<br />
      utilizado para crear y estructurar páginas web. Permite agregar
      elementos<br />
      como textos, imágenes, enlaces, tablas, formularios y contenido<br />
      multimedia.
    </p>

    <h2>Introducción a HTML</h2>

    <iframe
      src="https://www.youtube.com/embed/it1rTvBcfRg"
      width="640"
      height="360"
      frameborder="0"
      scrolling="no"
      allowfullscreen
    >
    </iframe>
  </body>
</html>
