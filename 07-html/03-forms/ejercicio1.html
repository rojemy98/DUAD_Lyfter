<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario de Votación</title>
  </head>

  <body>
    <h1>Formulario de Votación</h1>

    <form action="https://www.google.com">
      <label>Nombre completo:</label>
      <input type="text" name="nombre" />

      <br /><br />

      <label>Correo:</label>
      <input type="email" name="correo" />

      <br /><br />

      <label>Número de Identificación:</label>
      <input type="text" name="identificacion" />

      <br /><br />

      <label>Teléfono:</label>
      <input type="tel" name="telefono" />

      <br /><br />

      <h2>Seleccione un candidato</h2>

      <input type="radio" name="candidato" value="1" />
      <label>Candidato #1</label>

      <br />

      <input type="radio" name="candidato" value="2" />
      <label>Candidato #2</label>

      <br />

      <input type="radio" name="candidato" value="3" />
      <label>Candidato #3</label>

      <br /><br />

      <button type="submit">Confirmar voto</button>
    </form>
  </body>
</html>
