<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <link rel="stylesheet" href="ejercicio2.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>Dashboard</h2>

        <nav>
          <a href="#">Inicio</a>
          <a href="#">Usuarios</a>
          <a href="#">Productos</a>
          <a href="#">Ventas</a>
          <a href="#">Configuración</a>
        </nav>
      </aside>

      <!-- Contenido derecho -->
      <div class="page">
        <!-- Header -->
        <header>
          <h1>Mi Sistema</h1>

          <div class="user">Usuario: Rojemy</div>
        </header>

        <!-- Contenido principal -->
        <main>
          <h2>Resumen</h2>

          <div class="cards">
            <div class="card">
              <h3>Usuarios</h3>
              <p>150</p>
            </div>

            <div class="card">
              <h3>Productos</h3>
              <p>85</p>
            </div>

            <div class="card">
              <h3>Ventas</h3>
              <p>320</p>
            </div>

            <div class="card">
              <h3>Pedidos</h3>
              <p>45</p>
            </div>

            <div class="card">
              <h3>Ingresos</h3>
              <p>$12,500</p>
            </div>

            <div class="card">
              <h3>Visitas</h3>
              <p>1,250</p>
            </div>
          </div>
        </main>

        <!-- Footer -->
        <footer>
          <p>© 2026 Mi Sistema</p>
        </footer>
      </div>
    </div>
  </body>
</html>
