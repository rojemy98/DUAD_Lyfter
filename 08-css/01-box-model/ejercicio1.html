<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="ejercicio1.css" />
  </head>

  <body>
    <div class="form-container">
      <form action="https://dummyjson.com/test" method="POST" class="form">
        <div class="blue-line"></div>

        <h1>Contact us!</h1>

        <p>Got something to say? Fire away!</p>

        <label for="first_name">First name</label>
        <input
          type="text"
          id="first_name"
          name="firstName"
          placeholder="First name *"
        />

        <label for="last_name">Last name</label>
        <input
          type="text"
          id="last_name"
          name="lastName"
          placeholder="Last name *"
        />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email address *"
        />

        <label for="type">What's your message about?</label>
        <select name="type" id="type">
          <option value="" hidden>What's your message about? *</option>
          <option value="question">Question</option>
          <option value="suggestion">Suggestion</option>
        </select>

        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Fire away! *"
        ></textarea>

        <input class="submit-button" type="submit" value="Send my message" />
      </form>
    </div>
  </body>
</html>
