<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Billboard Hot 100</title>

    <link rel="stylesheet" href="ejercicio3.css" />
  </head>

  <body>
    <main class="billboard">
      <!-- Título -->
      <div class="title">
        <h1>Billboard Hot 100™</h1>
        <div class="line"></div>
        <h3>WEEK OF FEBRUARY 10, 2024</h3>
      </div>

      <!-- Tabla -->
      <table>
        <thead>
          <tr>
            <th colspan="3" class="this-week">THIS WEEK</th>

            <th>AWARD</th>

            <th>
              LAST<br />
              WEEK
            </th>

            <th>
              PEAK<br />
              POS.
            </th>

            <th>
              WKS ON<br />
              CHART
            </th>
          </tr>
        </thead>

        <tbody>
          <!-- Canción 1 -->
          <tr>
            <td class="position">1</td>

            <td class="cover">
              <img src="https://picsum.photos/150?random=1" alt="Album cover" />
            </td>

            <td class="song">
              <span class="movement down">↓</span>

              <div>
                <strong>Lovin On Me</strong>
                <span>Jack Harlow</span>
              </div>

              <span class="plus">+</span>
            </td>

            <td class="award">★</td>

            <td class="number">1</td>
            <td class="number peak">1</td>
            <td class="number">12</td>
          </tr>

          <!-- Canción 2 -->
          <tr>
            <td class="position">2</td>

            <td class="cover">
              <img src="https://picsum.photos/150?random=2" alt="Album cover" />
            </td>

            <td class="song">
              <span class="movement down">↓</span>

              <div>
                <strong>Cruel Summer</strong>
                <span>Taylor Swift</span>
              </div>

              <span class="plus">+</span>
            </td>

            <td class="award"></td>

            <td class="number">2</td>
            <td class="number peak">1</td>
            <td class="number">39</td>
          </tr>

          <!-- Canción 3 -->
          <tr>
            <td class="position">3</td>

            <td class="cover">
              <img src="https://picsum.photos/150?random=3" alt="Album cover" />
            </td>

            <td class="song">
              <span class="movement same">→</span>

              <div>
                <strong>Lose Control</strong>
                <span>Teddy Swims</span>
              </div>

              <span class="plus">+</span>
            </td>

            <td class="award">★</td>

            <td class="number">4</td>
            <td class="number peak">4</td>
            <td class="number">25</td>
          </tr>

          <!-- Canción 4 -->
          <tr>
            <td class="position">4</td>

            <td class="cover">
              <img src="https://picsum.photos/150?random=4" alt="Album cover" />
            </td>

            <td class="song">
              <span class="movement up">↑</span>

              <div>
                <strong>Beautiful Things</strong>
                <span>Benson Boone</span>
              </div>

              <span class="plus">+</span>
            </td>

            <td class="award"></td>

            <td class="number">5</td>
            <td class="number peak">3</td>
            <td class="number">15</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
